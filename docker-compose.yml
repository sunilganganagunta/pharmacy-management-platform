version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicoredb}
      POSTGRES_USER: ${POSTGRES_USER:-medicore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicore_pass123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore_user} -d ${POSTGRES_DB:-medicoredb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medicore-net

  # ----------------------------------------------------
  # 2. Spring Boot 3 Backend Service (Java 21)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: medicore-backend:latest
    container_name: medicore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medicoredb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medicore_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medicore_pass123}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - medicore-net

  # ----------------------------------------------------
  # 3. React Frontend & Nginx Reverse Proxy Service
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: medicore-frontend:latest
    container_name: medicore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medicore-net

networks:
  medicore-net:
    driver: bridge

volumes:
  pgdata:
    driver: local

