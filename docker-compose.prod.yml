version: '3.8'

# ========================================================
# MediCore Production Docker Compose for AWS EC2
# Images pulled from Amazon ECR with immutable Git SHA tags
# ========================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: medicore-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medicoredb}
      POSTGRES_USER: ${POSTGRES_USER:-medicore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/medicore/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicore_user} -d ${POSTGRES_DB:-medicoredb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medicore-prod-net

  backend:
    image: ${ECR_REGISTRY}/medicore-backend:${IMAGE_TAG:-latest}
    container_name: medicore-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/medicoredb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medicore_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,https://medicore.example.com}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - medicore-prod-net

  frontend:
    image: ${ECR_REGISTRY}/medicore-frontend:${IMAGE_TAG:-latest}
    container_name: medicore-prod-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medicore-prod-net

networks:
  medicore-prod-net:
    driver: bridge

