name: MediCore Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ========================================================
  # Backend Build and Automated Testing Job
  # ========================================================
  backend-ci:
    name: Backend CI (Java 21 & Spring Boot 3)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Verify Java & Maven Environment
        run: |
          java -version
          mvn -version

      - name: 4. Build Spring Boot Backend & Run Automated Tests
        working-directory: ./backend
        run: |
          mvn clean test -B

      - name: 5. Package Executable JAR (Production Artifact)
        working-directory: ./backend
        run: |
          mvn package -DskipTests -B

      - name: 6. Archive Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ========================================================
  # Frontend Build and Verification Job
  # ========================================================
  frontend-ci:
    name: Frontend CI (React, Vite & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package.json

      - name: 3. Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --prefer-offline || npm install

      - name: 4. Build Production React Distribution
        working-directory: ./frontend
        run: |
          npm run build

      - name: 5. Archive Frontend Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

