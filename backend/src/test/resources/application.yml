server:
  port: 8080

spring:
  application:
    name: medicore-backend-test
  datasource:
    url: jdbc:h2:mem:medicore_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

medicore:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 3600000
  cors:
    allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info

